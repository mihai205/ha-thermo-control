name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pytest-homeassistant-custom-component ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json, sys
          path = "custom_components/thermo_control/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          required = ["domain", "name", "version", "config_flow", "iot_class", "codeowners", "documentation", "requirements"]
          missing = [k for k in required if k not in manifest]
          if missing:
              print(f"manifest.json missing keys: {missing}")
              sys.exit(1)
          print("manifest.json OK")
          PY
